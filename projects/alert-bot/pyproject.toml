[project]
name = "alert-bot"
version = "1.0.0"
description = "Watch RSS/Atom/JSON sources and alert Slack or Telegram once per new matching item"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["alert_bot"]
