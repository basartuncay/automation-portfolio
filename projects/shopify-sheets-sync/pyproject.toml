[project]
name = "shopify-sheets-sync"
version = "1.0.0"
description = "Verified Shopify order webhooks upserted into Google Sheets"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "gspread>=6"]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
pythonpath = ["."]
