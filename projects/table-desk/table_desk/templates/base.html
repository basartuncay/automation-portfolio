<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Table Desk{% endblock %}</title>
<style>
:root { --bg:#eef0ea; --card:#fff; --ink:#1c2420; --mute:#5f6b63; --line:#d9ddd3; --brand:#1e4d3a; --brand-soft:#e3ece6;
        --ok:#2f6b3f; --ok-soft:#e6f4ec; --warn:#a35d00; --warn-soft:#fdf1dc; --bad:#b3261e; --bad-soft:#fbe9e7; }
* { box-sizing: border-box; }
body { margin:0; font:15px/1.5 Inter, system-ui, -apple-system, "Segoe UI", sans-serif; color:var(--ink); background:var(--bg); }
a { color:var(--brand); text-decoration:none; } a:hover { text-decoration:underline; }
.shell { display:grid; grid-template-columns:230px 1fr; min-height:100vh; }
nav { background:#111827; color:#d1d5db; padding:22px 16px; display:flex; flex-direction:column; gap:4px; }
nav .logo { color:#fff; font-weight:800; font-size:18px; margin:0 8px 18px; }
nav a { color:#d1d5db; padding:8px 10px; border-radius:8px; display:flex; justify-content:space-between; }
nav a.on, nav a:hover { background:#1f2937; color:#fff; text-decoration:none; }
nav .count { background:#dc2626; color:#fff; border-radius:99px; padding:0 8px; font-size:12px; line-height:20px; }
nav .me { margin-top:auto; font-size:13px; padding:8px 10px; border-top:1px solid #374151; }
nav .me button { background:none; border:0; color:#9ca3af; padding:0; cursor:pointer; font:inherit; }
main { padding:28px 36px; max-width:1280px; }
h1 { font-size:24px; margin:0 0 4px; } .sub { color:var(--mute); margin:0 0 22px; }
.card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:18px 20px; }
.grid { display:grid; gap:16px; }
.chip { display:inline-block; border-radius:99px; padding:1px 10px; font-size:12px; font-weight:600; background:#f3f4f6; color:#374151; white-space:nowrap; }
.chip.drafted { background:var(--brand-soft); color:var(--brand); } .chip.needs_human { background:var(--warn-soft); color:var(--warn); }
.chip.sent { background:var(--ok-soft); color:var(--ok); } .chip.high, .chip.flag { background:var(--bad-soft); color:var(--bad); }
.chip.engine { background:#f0fdfa; color:#0f766e; }
table { width:100%; border-collapse:collapse; } th, td { text-align:left; padding:11px 12px; border-bottom:1px solid var(--line); vertical-align:top; }
th { font-size:12px; text-transform:uppercase; letter-spacing:.04em; color:var(--mute); font-weight:600; }
tr.row:hover { background:#fafafa; cursor:pointer; }
.muted { color:var(--mute); } .small { font-size:13px; }
.btn { border:0; border-radius:8px; padding:9px 16px; font:600 14px inherit; font-family:inherit; cursor:pointer; background:var(--brand); color:#fff; }
.btn { white-space:nowrap; }
.btn.ghost { background:#fff; color:var(--ink); border:1px solid var(--line); }
.btn:disabled { background:#c7c9d1; cursor:not-allowed; }
textarea, input[type=email], input[type=password], input[type=text] { width:100%; border:1px solid var(--line); border-radius:8px; padding:10px 12px; font:inherit; }
textarea { min-height:300px; resize:vertical; }
.alert { border-radius:8px; padding:10px 14px; margin-bottom:14px; } .alert.warn { background:var(--warn-soft); color:var(--warn); }
.alert.bad { background:var(--bad-soft); color:var(--bad); } .alert.ok { background:var(--ok-soft); color:var(--ok); }
pre.mail { white-space:pre-wrap; font:inherit; margin:0; }
.tabs { display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap; } .tabs a { padding:6px 12px; border-radius:99px; background:#fff; border:1px solid var(--line); color:var(--ink); font-size:14px; }
.tabs a.on { background:var(--ink); color:#fff; border-color:var(--ink); text-decoration:none; }
.stat b { font-size:28px; display:block; } .stat span { color:var(--mute); font-size:13px; }
ol.sources li { margin-bottom:8px; } .timeline li { margin-bottom:8px; }
.num { text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
.cheaper { color:var(--bad); font-weight:700; } .dearer { color:var(--mute); } .oos { color:var(--mute); text-decoration:line-through; }
.chip.ok { background:var(--ok-soft); color:var(--ok); } .chip.suspicious, .chip.price_drop, .chip.stock, .chip.scraper_check { background:var(--warn-soft); color:var(--warn); }
.chip.failed, .chip.undercut, .chip.crawl_failed { background:var(--bad-soft); color:var(--bad); }
.btns { display:flex; gap:10px; }
.chip.done, .chip.approved { background:var(--ok-soft); color:var(--ok); } .chip.waiting_approval, .chip.pending, .chip.needs_approval { background:var(--warn-soft); color:var(--warn); }
.chip.failed, .chip.rejected, .chip.error { background:var(--bad-soft); color:var(--bad); } .chip.running, .chip.queued { background:var(--brand-soft); color:var(--brand); }
.trace { list-style:none; padding:0; margin:0; } .trace li { display:grid; grid-template-columns:120px 1fr; gap:14px; padding:12px 0; border-bottom:1px solid var(--line); }
.trace .who { font-size:12px; color:var(--mute); } .trace .who b { display:block; color:var(--ink); font-size:13px; }
pre.json { background:#0f172a; color:#e2e8f0; border-radius:8px; padding:10px 12px; font:12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; white-space:pre-wrap; margin:6px 0 0; }
.approval { border:2px solid #f59e0b; background:var(--warn-soft); border-radius:10px; padding:12px 14px; margin-top:8px; }
textarea.task { min-height:90px; } .head { display:flex; justify-content:space-between; align-items:flex-start; gap:20px; }
.chip.created, .chip.updated, .chip.resolved, .chip.connected, .chip.linked { background:var(--ok-soft); color:var(--ok); }
.chip.conflict, .chip.open, .chip.needs_reconnect { background:var(--warn-soft); color:var(--warn); }
.chip.dead { background:var(--bad-soft); color:var(--bad); }
.diff del { color:var(--bad); text-decoration:line-through; } .diff ins { color:var(--ok); text-decoration:none; font-weight:600; }
.side { display:inline-block; min-width:52px; font-weight:600; }

.chip.booked { background:var(--brand-soft); color:var(--brand); } .chip.seated { background:#eef2ff; color:#4338ca; }
.chip.no_show, .chip.cancelled { background:var(--bad-soft); color:var(--bad); } .chip.waiting, .chip.offered { background:var(--warn-soft); color:var(--warn); }
.chip.sent { background:var(--ok-soft); color:var(--ok); } .chip.skipped, .chip.expired { background:#f3f4f6; color:#6b7280; }
.floor { position:relative; } .floor .lane { display:grid; grid-template-columns:120px 1fr; align-items:center; border-bottom:1px solid var(--line); height:48px; }
.floor .lane .tid { font-weight:700; font-size:13px; } .floor .lane .tid span { display:block; font-weight:400; color:var(--mute); font-size:11px; }
.track { position:relative; height:100%; } .blk { position:absolute; top:6px; bottom:6px; border-radius:7px; padding:3px 8px; font-size:12px; line-height:1.25;
  overflow:hidden; white-space:nowrap; color:#fff; background:var(--brand); border:1px solid rgba(0,0,0,.08); }
.blk.seated { background:#4f46e5; } .blk.done { background:#9ca3af; } .blk.no_show { background:#fecaca; color:#7f1d1d; }
.blk.phone { box-shadow: inset 4px 0 0 #f59e0b; } .blk:hover { filter:brightness(1.08); text-decoration:none; }
.closed { position:absolute; top:0; bottom:0; background:repeating-linear-gradient(45deg,#f3f4f6,#f3f4f6 6px,#fff 6px,#fff 12px); }
.hours { position:relative; height:22px; margin-left:120px; font-size:11px; color:var(--mute); } .hours span { position:absolute; transform:translateX(-50%); }
.nowline { position:absolute; top:0; bottom:0; width:2px; background:#dc2626; z-index:2; }
.form-row { display:flex; gap:10px; flex-wrap:wrap; align-items:end; } .form-row label { font-size:12px; color:var(--mute); display:flex; flex-direction:column; gap:4px; }
.form-row input, .form-row select { border:1px solid var(--line); border-radius:8px; padding:8px 10px; font:inherit; }
select { border:1px solid var(--line); border-radius:8px; padding:8px 10px; font:inherit; background:#fff; }
.stats { display:grid; grid-template-columns:repeat(6,1fr); gap:12px; margin-bottom:16px; }
.mini { display:inline; } .mini button { background:none; border:1px solid var(--line); border-radius:6px; padding:2px 8px; font:12px inherit; cursor:pointer; }
/* identity */
.shell { display:block; }
nav { flex-direction:row; align-items:center; gap:4px; padding:0 28px; position:sticky; top:0; z-index:5; overflow-x:auto; }
nav .logo { margin:0 22px 0 0; white-space:nowrap; } nav a { white-space:nowrap; gap:8px; }
nav .me { margin:0 0 0 auto; border:0; display:flex; gap:12px; align-items:center; white-space:nowrap; }
main { margin:0 auto; }

body { font:15px/1.5 Optima, Candara, "Segoe UI", sans-serif; letter-spacing:.005em; }
nav { background:#1e3a2f; color:#cfd8cf; height:64px; border-bottom:3px solid #a87b2a; }
nav .logo { color:#f3ead6; font-size:21px; font-weight:600; letter-spacing:.04em; font-style:italic; }
nav .logo .small { color:#a8b5aa !important; font-style:normal; letter-spacing:0; font-size:12px; }
nav a { color:#cfd8cf; border-radius:0; padding:20px 14px 18px; border-bottom:3px solid transparent; margin-bottom:-3px; }
nav a.on, nav a:hover { background:none; color:#fff; border-bottom-color:#e2b65a; }
nav .me { color:#cfd8cf; } nav .me button { color:#e2b65a; }
main { max-width:1400px; padding:30px 40px; }
h1 { font-size:30px; font-weight:600; color:#1e3a2f; letter-spacing:.01em; }
.card { border-radius:4px; border-color:#d9ddd3; box-shadow:0 1px 0 #d9ddd3; }
th { text-transform:none; letter-spacing:0; font-size:13px; color:#1e3a2f; border-bottom:2px solid #a87b2a; }
.btn { border-radius:3px; background:#1e3a2f; letter-spacing:.03em; } .btn.ghost { border-color:#bfc7bd; }
.tabs a { border-radius:3px; } .tabs a.on { background:#1e3a2f; border-color:#1e3a2f; }
.chip { border-radius:3px; }
.blk { border-radius:3px; background:#1e4d3a; } .blk.seated { background:#a87b2a; } .blk.done { background:#a3aca5; }
.nowline { background:#c2410c; }
a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline:2px solid #a87b2a; outline-offset:2px; }
</style>
</head>
<body>
{% block body %}
<div class="shell">
  <nav>
    <div class="logo">Table Desk<div class="small muted" style="font-weight:400">{{ s.name }}</div></div>
    <a href="/panel" class="{{ 'on' if active == 'day' }}">Day view</a>
    <a href="/panel/waitlist" class="{{ 'on' if active == 'waitlist' }}">Waitlist {% if n.waitlist %}<span class="count" style="background:#d97706">{{ n.waitlist }}</span>{% endif %}</a>
    <a href="/panel/messages" class="{{ 'on' if active == 'messages' }}">Messages {% if n.inbox or n.failed %}<span class="count">{{ n.inbox + n.failed }}</span>{% endif %}</a>
    <a href="/panel/setup" class="{{ 'on' if active == 'setup' }}">Tables &amp; hours</a>
    <a href="/" target="_blank">Booking page ↗</a>
    <div class="me">{{ user.name }}
      <form method="post" action="/logout"><input type="hidden" name="csrf" value="{{ csrf }}"><button>Sign out</button></form>
    </div>
  </nav>
  <main>{% block main %}{% endblock %}</main>
</div>
{% endblock %}
</body>
</html>
