<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Book a table · {{ s.name }}{% endblock %}</title>
<style>
:root { --ink:#13232f; --paper:#fbfaf7; --line:#e3e0d8; --accent:#b8860b; --accent-ink:#5c4306; --mute:#6b6f76; --bad:#a3261f; --ok:#1f6b45; }
* { box-sizing:border-box; }
body { margin:0; background:var(--ink); color:var(--ink); font:16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; min-height:100vh; }
.wrap { max-width:560px; margin:0 auto; padding:40px 16px 60px; }
header { color:#f4efe2; margin-bottom:22px; } header h1 { font:700 34px/1.1 Georgia, "Times New Roman", serif; margin:0 0 6px; letter-spacing:-.01em; }
header p { margin:0; color:#b9c2c9; }
.card { background:var(--paper); border-radius:16px; padding:24px; }
.step { margin-bottom:22px; } .step h2 { font-size:14px; margin:0 0 10px; color:var(--mute); font-weight:600; }
.party { display:flex; gap:8px; flex-wrap:wrap; } .party button, .slots button { border:1px solid var(--line); background:#fff; border-radius:10px;
  padding:9px 0; width:52px; font:600 15px inherit; font-family:inherit; cursor:pointer; color:var(--ink); }
.party button[aria-pressed=true], .slots button[aria-pressed=true] { background:var(--ink); color:#fff; border-color:var(--ink); }
.slots { display:grid; grid-template-columns:repeat(auto-fill, minmax(70px, 1fr)); gap:8px; } .slots button { width:auto; }
input { width:100%; border:1px solid var(--line); border-radius:10px; padding:11px 12px; font:inherit; background:#fff; margin-bottom:10px; }
input:focus-visible, button:focus-visible { outline:3px solid var(--accent); outline-offset:1px; }
.go { width:100%; border:0; border-radius:12px; padding:14px; font:700 16px inherit; font-family:inherit; background:var(--accent); color:#fff; cursor:pointer; }
.go:disabled { background:#cfc8b6; cursor:not-allowed; }
.msg { border-radius:10px; padding:10px 12px; margin-bottom:12px; font-size:15px; } .msg.bad { background:#fbeceb; color:var(--bad); } .msg.ok { background:#e9f5ee; color:var(--ok); }
.muted { color:var(--mute); font-size:14px; } .hp { position:absolute; left:-9999px; }
.done h2 { font:700 26px Georgia, serif; margin:0 0 8px; } .code { font:700 22px ui-monospace, Menlo, monospace; letter-spacing:.12em; color:var(--accent-ink); }
a { color:var(--accent-ink); }
</style>
</head>
<body><div class="wrap">
<header><h1>{{ s.name }}</h1><p>{% block lead %}Book a table. You'll get a text to confirm it.{% endblock %}</p></header>
{% block content %}{% endblock %}
</div></body>
</html>
