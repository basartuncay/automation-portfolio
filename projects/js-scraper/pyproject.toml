[project]
name = "js-scraper"
version = "1.0.0"
description = "Scrape JavaScript-rendered sites with Playwright, or skip the browser by using the site's own JSON API"
requires-python = ">=3.11"
dependencies = ["playwright>=1.48", "httpx>=0.27", "selectolax>=1.0"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = ["live: hits the real site with a real browser (run with -m live)"]
addopts = "-m 'not live'"
