[project]
name = "kickoff"
version = "1.0.0"
description = "Client onboarding: enquiry to proposal, e-signature with signed PDF, Stripe deposit, automatic project setup"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27", "fpdf2>=2.8",
    "fastapi>=0.115", "uvicorn>=0.30", "jinja2>=3.1", "itsdangerous>=2.2", "python-multipart>=0.0.9",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
