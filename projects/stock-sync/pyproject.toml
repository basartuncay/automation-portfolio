[project]
name = "stock-sync"
version = "1.0.0"
description = "Multi-channel inventory: one stock ledger for Shopify, Amazon and the warehouse, bundles, buffers, oversell handling, reconciliation"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "fastapi>=0.115", "uvicorn>=0.30", "jinja2>=3.1", "itsdangerous>=2.2", "python-multipart>=0.0.9",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
