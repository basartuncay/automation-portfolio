[project]
name = "ops-agent"
version = "1.0.0"
description = "Back-office AI agent: Claude tool use over shop operations, policy-gated writes, human approvals, traces, evals, MCP server"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.7,<3", "mcp>=2.3,<3",
    "fastapi>=0.115", "uvicorn>=0.30", "jinja2>=3.1", "itsdangerous>=2.2", "python-multipart>=0.0.9",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
pythonpath = ["."]
