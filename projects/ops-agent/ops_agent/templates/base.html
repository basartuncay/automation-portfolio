<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Ops Agent{% endblock %}</title>
<style>
:root { --bg:#eef2f1; --card:#fff; --ink:#14262b; --mute:#56686d; --line:#d3dddc; --brand:#0f4c55; --brand-soft:#e1eeef;
        --ok:#1d7a4e; --ok-soft:#e6f4ec; --warn:#9a5b00; --warn-soft:#fff3d6; --bad:#b3261e; --bad-soft:#fbe9e7; }
* { box-sizing: border-box; }
body { margin:0; font:15px/1.5 Inter, system-ui, -apple-system, "Segoe UI", sans-serif; color:var(--ink); background:var(--bg); }
a { color:var(--brand); text-decoration:none; } a:hover { text-decoration:underline; }
.shell { display:grid; grid-template-columns:230px 1fr; min-height:100vh; }
nav { background:#111827; color:#d1d5db; padding:22px 16px; display:flex; flex-direction:column; gap:4px; }
nav .logo { color:#fff; font-weight:800; font-size:18px; margin:0 8px 18px; }
nav a { color:#d1d5db; padding:8px 10px; border-radius:8px; display:flex; justify-content:space-between; }
nav a.on, nav a:hover { background:#1f2937; color:#fff; text-decoration:none; }
nav .count { background:#dc2626; color:#fff; border-radius:99px; padding:0 8px; font-size:12px; line-height:20px; }
nav .me { margin-top:auto; font-size:13px; padding:8px 10px; border-top:1px solid #374151; }
nav .me button { background:none; border:0; color:#9ca3af; padding:0; cursor:pointer; font:inherit; }
main { padding:28px 36px; max-width:1280px; }
h1 { font-size:24px; margin:0 0 4px; } .sub { color:var(--mute); margin:0 0 22px; }
.card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:18px 20px; }
.grid { display:grid; gap:16px; }
.chip { display:inline-block; border-radius:99px; padding:1px 10px; font-size:12px; font-weight:600; background:#f3f4f6; color:#374151; white-space:nowrap; }
.chip.drafted { background:var(--brand-soft); color:var(--brand); } .chip.needs_human { background:var(--warn-soft); color:var(--warn); }
.chip.sent { background:var(--ok-soft); color:var(--ok); } .chip.high, .chip.flag { background:var(--bad-soft); color:var(--bad); }
.chip.engine { background:#f0fdfa; color:#0f766e; }
table { width:100%; border-collapse:collapse; } th, td { text-align:left; padding:11px 12px; border-bottom:1px solid var(--line); vertical-align:top; }
th { font-size:12px; text-transform:uppercase; letter-spacing:.04em; color:var(--mute); font-weight:600; }
tr.row:hover { background:#fafafa; cursor:pointer; }
.muted { color:var(--mute); } .small { font-size:13px; }
.btn { border:0; border-radius:8px; padding:9px 16px; font:600 14px inherit; font-family:inherit; cursor:pointer; background:var(--brand); color:#fff; }
.btn.ghost { background:#fff; color:var(--ink); border:1px solid var(--line); }
.btn:disabled { background:#c7c9d1; cursor:not-allowed; }
textarea, input[type=email], input[type=password], input[type=text] { width:100%; border:1px solid var(--line); border-radius:8px; padding:10px 12px; font:inherit; }
textarea { min-height:300px; resize:vertical; }
.alert { border-radius:8px; padding:10px 14px; margin-bottom:14px; } .alert.warn { background:var(--warn-soft); color:var(--warn); }
.alert.bad { background:var(--bad-soft); color:var(--bad); } .alert.ok { background:var(--ok-soft); color:var(--ok); }
pre.mail { white-space:pre-wrap; font:inherit; margin:0; }
.tabs { display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap; } .tabs a { padding:6px 12px; border-radius:99px; background:#fff; border:1px solid var(--line); color:var(--ink); font-size:14px; }
.tabs a.on { background:var(--ink); color:#fff; border-color:var(--ink); text-decoration:none; }
.stat b { font-size:28px; display:block; } .stat span { color:var(--mute); font-size:13px; }
ol.sources li { margin-bottom:8px; } .timeline li { margin-bottom:8px; }
.num { text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
.cheaper { color:var(--bad); font-weight:700; } .dearer { color:var(--mute); } .oos { color:var(--mute); text-decoration:line-through; }
.chip.ok { background:var(--ok-soft); color:var(--ok); } .chip.suspicious, .chip.price_drop, .chip.stock, .chip.scraper_check { background:var(--warn-soft); color:var(--warn); }
.chip.failed, .chip.undercut, .chip.crawl_failed { background:var(--bad-soft); color:var(--bad); }
.btns { display:flex; gap:10px; }
.chip.done, .chip.approved { background:var(--ok-soft); color:var(--ok); } .chip.waiting_approval, .chip.pending, .chip.needs_approval { background:var(--warn-soft); color:var(--warn); }
.chip.failed, .chip.rejected, .chip.error { background:var(--bad-soft); color:var(--bad); } .chip.running, .chip.queued { background:var(--brand-soft); color:var(--brand); }
.trace { list-style:none; padding:0; margin:0; } .trace li { display:grid; grid-template-columns:120px 1fr; gap:14px; padding:12px 0; border-bottom:1px solid var(--line); }
.trace .who { font-size:12px; color:var(--mute); } .trace .who b { display:block; color:var(--ink); font-size:13px; }
pre.json { background:#0f172a; color:#e2e8f0; border-radius:8px; padding:10px 12px; font:12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; white-space:pre-wrap; margin:6px 0 0; }
.approval { border:2px solid #f59e0b; background:var(--warn-soft); border-radius:10px; padding:12px 14px; margin-top:8px; }
textarea.task { min-height:90px; } .head { display:flex; justify-content:space-between; align-items:flex-start; gap:20px; }
/* identity */
.shell { display:block; }
nav { flex-direction:row; align-items:center; gap:4px; padding:0 28px; position:sticky; top:0; z-index:5; overflow-x:auto; }
nav .logo { margin:0 22px 0 0; white-space:nowrap; } nav a { white-space:nowrap; gap:8px; }
nav .me { margin:0 0 0 auto; border:0; display:flex; gap:12px; align-items:center; white-space:nowrap; }
main { margin:0 auto; }

body { font:14.5px/1.5 "Lucida Grande", "Lucida Sans Unicode", "Segoe UI", sans-serif; }
nav { background:#12343b; color:#b9cfd2; padding:0 32px; height:auto; flex-wrap:wrap; row-gap:0; }
nav .logo { color:#fff; font:700 22px/1 Rockwell, "Roboto Slab", Georgia, serif; flex-basis:100%; padding:16px 0 12px; margin:0; display:flex; align-items:center; gap:10px; }
nav .logo::before { content:""; width:10px; height:10px; border-radius:50%; background:#f0a500; box-shadow:0 0 0 4px #f0a50033; }
nav a { color:#b9cfd2; border-radius:6px 6px 0 0; padding:9px 16px; font-size:14px; }
nav a.on { background:#eef2f1; color:#12343b; font-weight:700; } nav a:hover { background:#1b4750; color:#fff; } nav a.on:hover { background:#eef2f1; color:#12343b; }
nav .count { background:#f0a500; color:#14262b; }
nav .me { color:#b9cfd2; font-size:13px; } nav .me button { color:#f0a500; }
main { max-width:1300px; padding:30px 32px; }
h1, h2, h3 { font-family:Rockwell, "Roboto Slab", Georgia, serif; } h1 { font-size:28px; }
.card { border-radius:6px; border-color:#d3dddc; }
th { text-transform:none; letter-spacing:0; font-size:12.5px; color:#0f4c55; }
.btn { border-radius:6px; background:#0f4c55; } .btn.ghost { background:#fff; }
.approval { border:0; border-left:6px solid #f0a500; background:#fff3d6; border-radius:4px; }
.trace li { grid-template-columns:130px 1fr; } .trace .who b { font-family:Rockwell, Georgia, serif; }
pre.json { background:#12343b; }
.tabs a.on { background:#12343b; border-color:#12343b; }
@media (max-width:760px) { main { padding:20px 16px; } }
a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline:2px solid #f0a500; outline-offset:2px; }
</style>
</head>
<body>
{% block body %}
<div class="shell">
  <nav>
    <div class="logo">Ops Agent</div>
    <a href="/" class="{{ 'on' if active == 'runs' }}">Tasks</a>
    <a href="/approvals" class="{{ 'on' if active == 'approvals' }}">Approvals {% if pending_count %}<span class="count">{{ pending_count }}</span>{% endif %}</a>
    <a href="/shop" class="{{ 'on' if active == 'shop' }}">Shop activity</a>
    <a href="/evals" class="{{ 'on' if active == 'evals' }}">Evals</a>
    <div class="me">{{ user.name }} · {{ user.role }}
      <form method="post" action="/logout"><input type="hidden" name="csrf" value="{{ csrf }}"><button>Sign out</button></form>
    </div>
  </nav>
  <main>{% block main %}{% endblock %}</main>
</div>
{% endblock %}
</body>
</html>
