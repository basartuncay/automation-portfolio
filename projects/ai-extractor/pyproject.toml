[project]
name = "ai-extractor"
version = "1.0.0"
description = "Extract structured JSON from any web page with Claude and a JSON schema, no selectors"
requires-python = ">=3.11"
dependencies = ["anthropic>=2.7,<3", "httpx>=0.27", "selectolax>=1.0"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
