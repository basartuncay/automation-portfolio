[project]
name = "email-triage"
version = "1.0.0"
description = "Classify inbound email and extract structured fields with Claude; route by category"
requires-python = ">=3.11"
dependencies = ["anthropic>=2.7,<3", "pydantic>=2"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
