[project]
name = "invoice-extractor"
version = "1.0.0"
description = "Extract structured data from PDF invoices with arithmetic checks and a review queue"
requires-python = ">=3.11"
dependencies = ["pdfplumber>=0.11"]

[dependency-groups]
dev = ["pytest>=8", "reportlab>=4"]

[tool.pytest.ini_options]
pythonpath = ["."]
