[project]
name = "invoice-extractor"
version = "1.0.0"
description = "Extract structured data from PDF invoices with arithmetic checks and a review queue"
requires-python = ">=3.11"
dependencies = ["pdfplumber>=0.11"]

[project.optional-dependencies]
api = ["fastapi>=0.115", "uvicorn>=0.30", "python-multipart>=0.0.9"]
ocr = ["pytesseract>=0.3.13"]

[dependency-groups]
dev = ["pytest>=8", "reportlab>=4", "httpx>=0.27"]

[tool.pytest.ini_options]
pythonpath = ["."]
