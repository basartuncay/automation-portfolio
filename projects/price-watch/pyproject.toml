[project]
name = "price-watch"
version = "1.0.0"
description = "Competitor price tracking: scheduled crawls, history, undercut/drop/stock alerts, weekly digest, panel"
requires-python = ">=3.11"
dependencies = [
    "price-monitor", "alert-bot",
    "fastapi>=0.115", "uvicorn>=0.30", "jinja2>=3.1", "itsdangerous>=2.2", "python-multipart>=0.0.9",
]

[tool.uv.sources]
price-monitor = { path = "../price-monitor" }
alert-bot = { path = "../alert-bot" }

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8",
]

[tool.pytest.ini_options]
pythonpath = ["."]
