[project]
name = "ai-extractor-actor"
version = "1.0.0"
description = "Apify actor: schema-driven web extraction with Claude (bring your own Anthropic key)"
requires-python = ">=3.11"
dependencies = ["apify>=2.3", "anthropic>=2.7,<3", "httpx>=0.27", "selectolax>=1.0"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = [".", "../ai-extractor"]
