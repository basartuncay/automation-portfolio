[project]
name = "sheet-to-crm"
version = "1.0.0"
description = "Load CSV/Excel into Airtable: column mapping, validation, dedupe, batched rate-limited upserts"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "openpyxl>=3.1"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
