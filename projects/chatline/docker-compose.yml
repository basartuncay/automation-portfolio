# WhatsApp customer service. One command:
#   ./setup.sh && docker compose up --build     team inbox http://127.0.0.1:8108 , a customer's phone http://127.0.0.1:8109/phone/4917612345678?token=<FAKES_ADMIN_TOKEN>
name: chatline

x-env: &env
  WA_ACCESS_TOKEN: ${WA_ACCESS_TOKEN:?run ./setup.sh first}       # a System User token from Meta Business
  WA_APP_SECRET: ${WA_APP_SECRET:?run ./setup.sh first}           # signs the webhooks (X-Hub-Signature-256)
  WA_PHONE_NUMBER_ID: "109876543210"
  SHOP_TOKEN: ${SHOP_TOKEN:?run ./setup.sh first}
  SHOP_WEBHOOK_SECRET: ${SHOP_WEBHOOK_SECRET:?run ./setup.sh first}

services:
  web:
    build: .
    environment:
      <<: *env
      SECRET_KEY: ${SECRET_KEY:?run ./setup.sh first}
      WA_VERIFY_TOKEN: ${WA_VERIFY_TOKEN:?run ./setup.sh first}   # what you type into the webhook settings in Meta
      GRAPH_URL: http://apis:8000/graph                           # for real use: https://graph.facebook.com
      SHOP_URL: http://apis:8000/shop
      DEMO_SEED: ${DEMO_SEED:-true}
    volumes: [data:/data]
    ports: ["127.0.0.1:8108:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 3s
      retries: 20
    restart: unless-stopped

  apis:
    # Demo only: the WhatsApp Cloud API (with its 24-hour and template rules), customers' phones and a shop.
    build: .
    command: ["uvicorn", "chatline.fakes:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      <<: *env
      FAKES_ADMIN_TOKEN: ${FAKES_ADMIN_TOKEN:?run ./setup.sh first}
      WA_WEBHOOK_URL: http://web:8000/webhooks/whatsapp
      SHOP_WEBHOOK_URL: http://web:8000/webhooks/shop
    ports: ["127.0.0.1:8109:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 3s
      retries: 20

volumes:
  data:
