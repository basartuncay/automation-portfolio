[project]
name = "stripe-fulfillment"
version = "1.0.0"
description = "Verified Stripe webhooks -> idempotent order fulfillment (license keys, access revocation, dunning)"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "stripe>=11"]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
pythonpath = ["."]
