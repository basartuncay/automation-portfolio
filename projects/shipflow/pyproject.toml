[project]
name = "shipflow"
version = "1.0.0"
description = "Shipping automation: carrier rules, address and customs checks, labels, batch printing, fulfilment back to the shop, tracking exceptions"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27", "fpdf2>=2.8", "pypdf>=5",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "itsdangerous>=2.2",
    "python-multipart>=0.0.9",
    "tzdata>=2026.6",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
pythonpath = ["."]
