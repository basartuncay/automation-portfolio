{% extends "base.html" %}
{% block body %}
<div style="max-width:380px;margin:12vh auto" class="card">
  <h1>Revenue</h1>
  <p class="sub">Orders, payments and ad spend in one verified view.</p>
  {% if error %}<div class="alert bad">{{ error }}</div>{% endif %}
  <form method="post" action="/login" class="grid">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <input type="email" name="email" placeholder="Email" required autofocus aria-label="Email">
    <input type="password" name="password" placeholder="Password" required aria-label="Password">
    <button class="btn">Sign in</button>
  </form>
</div>
{% endblock %}
