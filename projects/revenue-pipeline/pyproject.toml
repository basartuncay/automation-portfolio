[project]
name = "revenue-pipeline"
version = "1.0.0"
description = "Orders, payments and ad spend -> DuckDB warehouse with dbt models, data tests, reconciliation and a dashboard"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27", "duckdb>=1.1", "dbt-core>=1.9", "dbt-duckdb>=1.9",
    "fastapi>=0.115", "uvicorn>=0.30", "jinja2>=3.1", "itsdangerous>=2.2", "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8",
]

[tool.pytest.ini_options]
pythonpath = ["."]
