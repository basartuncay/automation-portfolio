[project]
name = "paymatch"
version = "1.0.0"
description = "Bank reconciliation: CAMT.053/CSV statements matched to open invoices with explained confidence, booked to accounting, dunning for the rest"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27", "defusedxml>=0.7",
    "fastapi>=0.115", "uvicorn>=0.30", "jinja2>=3.1", "itsdangerous>=2.2", "python-multipart>=0.0.9",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
