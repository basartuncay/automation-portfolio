name: tests
on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [price-monitor, invoice-extractor, shopify-sheets-sync, email-triage, js-scraper,
                  sheet-to-crm, alert-bot, stripe-fulfillment, doc-qa, kpi-report, ai-extractor, ai-extractor-actor,
                  invoice-platform, support-desk, price-watch, ops-agent, sync-hub, revenue-pipeline, table-desk, lead-engine, stock-sync, kickoff, paymatch, chatline]
    defaults:
      run:
        working-directory: projects/${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - if: matrix.project == 'invoice-extractor'
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr  # enables the real OCR test
      - run: uv sync --all-extras
      - run: uv run pytest -q -rs

  niche-finder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 projects/apify-niche-finder/niche_finder.py test

  laravel:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/filament-ops-panel/src
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: intl, zip, bcmath, pdo_sqlite
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env && php artisan key:generate
      - run: php artisan test

  n8n-flow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install -g n8n@2.4.6 && sudo apt-get install -y sqlite3
      - name: Start the extractor API
        working-directory: projects/invoice-extractor
        run: |
          uv sync --all-extras
          uv run python make_samples.py /tmp/invoices
          # Start from the venv directly: a background `uv run` would hold uv's cache lock past the job.
          .venv/bin/uvicorn invoice_extractor.api:app --port 8077 &
          echo $! > /tmp/extractor.pid
          sleep 5
      - run: projects/n8n-invoice-flow/test_flow.sh /tmp/invoices
      - name: Stop the extractor API
        if: always()
        run: kill "$(cat /tmp/extractor.pid)" || true

  platform-e2e:
    # The whole flagship stack in Docker: email in over SMTP -> intake -> OCR/extraction -> panel database.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: End-to-end test
        working-directory: projects/invoice-platform
        run: ./e2e.sh  # stack is left up so the log step below can read it; the runner is discarded anyway
      - name: Logs on failure
        if: failure()
        working-directory: projects/invoice-platform
        run: docker compose logs --tail 80

  support-e2e:
    # Support Desk stack in Docker: customer email over SMTP -> triage + cited draft -> agent sends -> reply in customer's mailbox.
    runs-on: ubuntu-latest
